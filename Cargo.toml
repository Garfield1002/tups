[package]
name = "tups"
version = "0.1.0"
edition = "2021"
description = "tups: small, weak, movable containers for coding agents — contain the blast radius, move the session."

[[bin]]
name = "tup"
path = "src/main.rs"

[features]
# Pyrex (the in-house raw-namespace backend) is the default backend, compiled in by default.
# Build with `--no-default-features` for a bwrap-only binary; at runtime, TUP_SANDBOX=bwrap
# selects bubblewrap even in a default build. See src/pyrex.rs.
default = ["pyrex"]
pyrex = []

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dependencies]
libc = "0.2.191"
