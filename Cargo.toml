[package]
name = "bags"
version = "0.0.1"
edition = "2021"
description = "Ultra-micro containers for coding agents: contain the blast radius, move the session."

[[bin]]
name = "bags"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dependencies]
libc = "0.2.191"
